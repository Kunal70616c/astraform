server:
  port: 8081

spring:
  application:
    name: document-service

  datasource:
    url: jdbc:postgresql://localhost:5432/astraform_documents
    username: astraform
    password: astraform123
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

minio:
  endpoint: http://localhost:9000
  access-key: astraform
  secret-key: astraform123
  bucket-name: astraform-documents

eureka:
  client:
    enabled: false   # flip to true when Eureka server is running

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.astraform: DEBUG
